{{- $alb := .Values.albIngressController | default dict }}
{{- if (get $alb "enabled") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Values.appName }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $.Values.appName }}
  annotations:
    alb.ingress.kubernetes.io/group.name: {{ get $alb "groupName" }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": {{ get $alb "listenPorts" }}}, {"HTTP":80}]'
    alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}'
    alb.ingress.kubernetes.io/certificate-arn: {{ get $alb "certificateArn" }}
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/success-codes: 200,400,404,405
    alb.ingress.kubernetes.io/target-type: instance
    kubernetes.io/ingress.class: alb
spec:
  rules:
  {{- range $key, $value := .Values.hostnames }}
  - host: {{ $value.host }}.{{ if (empty $value.customDomain) }}{{ $.Values.defaultDomain }}{{ else }}{{ $value.customDomain }}{{ end }}
    http:
      paths:
      - backend:
          service:
            name: ssl-redirect
            port:
              name: use-annotation
        path: /
        pathType: Prefix
      - backend:
          service:
            name: {{ $.Values.appName }}
            port:
              number: {{ $.Values.service.port }}
        path: /
        pathType: Prefix
  {{- end }}
{{- end }}
